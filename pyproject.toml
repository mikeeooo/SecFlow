[project]
name = "secflow"
version = "2.0.0"
description = "SecFlow: explainable risk analysis of MIA Plati Instant payments (MDL) with scikit-learn anomaly detection and an evidence-first decision policy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=2.1",
    "scikit-learn>=1.7",
    "joblib>=1.4",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
    "import-linter>=2.17",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["frontend"]

[tool.coverage.run]
source = ["backend", "ml", "datagen", "config"]
omit = ["backend/tests/*"]

[tool.coverage.report]
fail_under = 97

[tool.importlinter]
root_packages = ["backend", "ml", "datagen", "config"]

[[tool.importlinter.contracts]]
name = "Layers backend -> ml -> datagen -> config"
type = "layers"
layers = ["backend", "ml", "datagen", "config"]
